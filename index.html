<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadence — Discovery Call</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0b0b0d;
      --surface:  #141417;
      --border:   rgba(255,255,255,0.08);
      --text:     #e8e8ed;
      --muted:    #6e6e80;
      --accent:   #6366f1;
      --green:    #10b981;
      --red:      #f87171;
    }

    html, body {
      height: 100%; width: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }

    /* ── Background watermark ── */
    .bg-watermark {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 480px; height: 480px;
      opacity: 0.13;
      mix-blend-mode: screen;
      pointer-events: none;
      z-index: 0;
    }

    /* ── Screens ── */
    .screen {
      display: none; flex-direction: column; align-items: center; gap: 0;
      padding: 40px; max-width: 420px; width: 100%;
      position: relative; z-index: 1;
    }
    .screen.active { display: flex; }

    .brand {
      display: inline-flex; align-items: center; gap: 8px;
      font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--muted); font-weight: 500; margin-bottom: 48px;
    }
    .brand-icon { width: 18px; height: 18px; flex-shrink: 0; }

    /* ── Pre-call screen ── */
    .precall-title { font-size: 22px; font-weight: 500; letter-spacing: -0.01em; margin-bottom: 8px; text-align: center; }
    .precall-sub   { font-size: 14px; color: var(--muted); text-align: center; line-height: 1.6; margin-bottom: 40px; }

    .check-card {
      width: 100%; background: var(--surface);
      border: 1px solid var(--border); border-radius: 16px;
      padding: 20px 24px; margin-bottom: 12px;
    }
    .check-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .check-label  { font-size: 13px; font-weight: 500; letter-spacing: 0.02em; }
    .check-status { font-size: 12px; color: var(--muted); }
    .check-status.ok  { color: var(--green); }
    .check-status.bad { color: var(--red); }

    .mic-level { display: flex; align-items: flex-end; gap: 3px; height: 28px; }
    .mic-bar { width: 4px; min-height: 4px; border-radius: 3px; background: var(--accent); opacity: 0.25; transition: height 0.08s ease, opacity 0.1s ease; }
    .mic-bar.active { opacity: 1; }

    .test-btn {
      background: transparent; border: 1px solid var(--border); border-radius: 8px;
      color: var(--muted); font-size: 13px; font-family: inherit;
      padding: 8px 18px; cursor: pointer; transition: all 0.2s ease; letter-spacing: 0.02em;
    }
    .test-btn:hover { border-color: rgba(255,255,255,0.2); color: var(--text); background: rgba(255,255,255,0.04); }
    .test-btn.played { color: var(--green); border-color: rgba(16,185,129,0.3); }

    .start-btn {
      width: 100%; margin-top: 24px; padding: 16px;
      background: var(--accent); border: none; border-radius: 12px;
      color: #fff; font-size: 15px; font-family: inherit; font-weight: 500;
      cursor: pointer; letter-spacing: 0.01em;
      transition: opacity 0.2s ease, transform 0.1s ease;
    }
    .start-btn:hover   { opacity: 0.9; }
    .start-btn:active  { transform: scale(0.99); }
    .start-btn:disabled { opacity: 0.35; cursor: not-allowed; }

    /* ── Call screen ── */
    .orb-scene {
      position: relative; width: 280px; height: 280px;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 48px;
    }

    .ring {
      position: absolute; border-radius: 50%;
      border: 1px solid rgba(99,102,241,0.06);
      animation: ring-breathe 5s ease-in-out infinite;
    }
    .ring-1 { width: 192px; height: 192px; }
    .ring-2 { width: 236px; height: 236px; animation-delay: 0.8s; }
    .ring-3 { width: 280px; height: 280px; animation-delay: 1.6s; }

    @keyframes ring-breathe  { 0%,100%{opacity:.25} 50%{opacity:.7} }
    @keyframes ring-think    { 0%,100%{opacity:.08; transform:scale(1)} 50%{opacity:.55; transform:scale(1.03)} }
    @keyframes ring-speak    { 0%,100%{opacity:.15} 50%{opacity:.7} }

    /* ── Orb keyframes ── */
    @keyframes orb-shimmer   { to { transform: rotate(360deg); } }
    @keyframes orb-connect   { 0%,100%{opacity:.22} 50%{opacity:.5} }

    @keyframes orb-idle {
      0%, 100% {
        transform: scale(1);
        box-shadow:
          0 0 38px rgba(99,102,241,0.20),
          0 0 88px rgba(99,102,241,0.08),
          inset 0 0 36px rgba(0,0,0,0.55),
          inset 0 1px 0 rgba(255,255,255,0.07);
      }
      50% {
        transform: scale(1.04);
        box-shadow:
          0 0 64px rgba(99,102,241,0.38),
          0 0 128px rgba(99,102,241,0.16),
          inset 0 0 36px rgba(0,0,0,0.55),
          inset 0 1px 0 rgba(255,255,255,0.07);
      }
    }

    @keyframes orb-think {
      0%, 100% {
        transform: scale(1);
        box-shadow:
          0 0 44px rgba(52,211,153,0.22),
          0 0 88px rgba(52,211,153,0.09),
          inset 0 0 36px rgba(0,0,0,0.55);
      }
      45%, 55% {
        transform: scale(1.06);
        box-shadow:
          0 0 72px rgba(52,211,153,0.44),
          0 0 144px rgba(52,211,153,0.18),
          inset 0 0 36px rgba(0,0,0,0.55);
      }
    }

    @keyframes orb-speak-pulse {
      0%, 100% { filter: brightness(1); }
      50%       { filter: brightness(1.18); }
    }

    /* ── Orb base ── */
    .orb {
      position: relative;
      width: 120px; height: 120px; border-radius: 50%;
      overflow: hidden;
      background:
        radial-gradient(circle at 30% 24%, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0.04) 28%, transparent 52%),
        radial-gradient(circle at 68% 74%, rgba(79,70,229,0.38) 0%, transparent 48%),
        radial-gradient(ellipse at 42% 38%, #5254cc 0%, #26247a 32%, #0e0c35 60%, #07070e 100%);
      box-shadow:
        0 0 38px rgba(99,102,241,0.20),
        0 0 88px rgba(99,102,241,0.08),
        inset 0 0 36px rgba(0,0,0,0.55),
        inset 0 1px 0 rgba(255,255,255,0.07);
      transition: background 0.5s ease, filter 0.35s ease;
      animation: orb-idle 5s ease-in-out infinite;
      will-change: transform, filter;
    }

    /* Glass rim */
    .orb::before {
      content: '';
      position: absolute; inset: 0; border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.08);
      background: radial-gradient(circle at 34% 28%, rgba(255,255,255,0.07) 0%, transparent 55%);
    }

    /* Rotating specular shimmer */
    .orb::after {
      content: '';
      position: absolute;
      width: 200%; height: 200%;
      top: -50%; left: -50%;
      background: radial-gradient(ellipse at 32% 26%, rgba(165,180,252,0.20) 0%, transparent 52%);
      animation: orb-shimmer 14s linear infinite;
    }

    .orb.speaking {
      animation: orb-speak-pulse 0.75s ease-in-out infinite;
      background:
        radial-gradient(circle at 30% 24%, rgba(255,255,255,0.18) 0%, rgba(255,255,255,0.06) 28%, transparent 52%),
        radial-gradient(circle at 68% 74%, rgba(129,140,248,0.42) 0%, transparent 48%),
        radial-gradient(ellipse at 42% 38%, #818cf8 0%, #312e81 32%, #120f42 60%, #08080f 100%);
    }

    .orb.thinking {
      animation: orb-think 2s ease-in-out infinite;
      background:
        radial-gradient(circle at 30% 24%, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0.03) 28%, transparent 52%),
        radial-gradient(circle at 68% 74%, rgba(52,211,153,0.36) 0%, transparent 48%),
        radial-gradient(ellipse at 42% 38%, #34d399 0%, #065f46 32%, #021a12 60%, #060d0a 100%);
    }

    .orb.connecting { animation: orb-connect 2.5s ease-in-out infinite; }

    /* Ring states via orb-scene parent class */
    .orb-scene.state-thinking .ring   { animation: ring-think 2s ease-in-out infinite; border-color: rgba(52,211,153,0.08); }
    .orb-scene.state-thinking .ring-2 { animation-delay: 0.3s; }
    .orb-scene.state-thinking .ring-3 { animation-delay: 0.6s; }
    .orb-scene.state-speaking .ring   { animation: ring-speak 0.75s ease-in-out infinite; }
    .orb-scene.state-speaking .ring-2 { animation-delay: 0.15s; }
    .orb-scene.state-speaking .ring-3 { animation-delay: 0.3s; }

    .status-label { font-size: 15px; color: var(--muted); letter-spacing: 0.01em; min-height: 22px; margin-bottom: 14px; text-align: center; }

    .call-mic-bars { display:flex; align-items:flex-end; justify-content:center; gap:3px; height:18px; margin-bottom: 48px; opacity:0; transition:opacity .3s ease; }
    .call-mic-bars.active { opacity:1; }
    .call-mic-bar { width:3px; min-height:3px; border-radius:2px; background:var(--green); transition:height .07s ease; }

    .end-btn {
      padding: 13px 44px; background: transparent;
      border: 1px solid var(--border); border-radius: 100px;
      color: var(--muted); font-size: 14px; font-family: inherit;
      letter-spacing: 0.04em; cursor: pointer; transition: all 0.2s ease;
    }
    .end-btn:hover { border-color: rgba(255,255,255,0.22); color: var(--text); background: rgba(255,255,255,0.04); }

    /* ── Ended screen ── */
    .ended-title { font-size: 22px; font-weight: 500; letter-spacing: -0.01em; margin-bottom: 12px; }
    .ended-sub   { font-size: 15px; color: var(--muted); line-height: 1.7; text-align: center; }
  </style>
</head>
<body>

  <!-- ── Background watermark ── -->
  <!-- REVERT: to restore original SVG logo watermark, replace the <img> below with this block:
  <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">

    <rect x="51" y="39" width="5" height="10" rx="1" fill="#2e2b6e"/>
    <rect x="60" y="35" width="5" height="18" rx="1" fill="#2e2b6e"/>
    <rect x="69" y="38" width="5" height="12" rx="1" fill="#2e2b6e"/>
    <polygon points="12,10 20,4 84,4 76,10" fill="#a5b4fc"/>

  </svg>
  Also revert CSS .bg-watermark: opacity: 0.035, remove mix-blend-mode, width/height: 400px
  -->
  <div class="bg-watermark" aria-hidden="true">
    <img src="bg-watermark.png" width="100%" height="100%" alt="" style="object-fit: contain;">
  </div>

  <!-- ── Screen 1: Pre-call checks ── -->
  <div class="screen active" id="precall-screen">
    <span class="brand">
      <svg class="brand-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <polygon points="40,24 84,24 84,64 40,64" fill="#1a1748"/>
        <polygon points="12,10 20,4 84,4 76,10" fill="#a5b4fc"/>
        <polygon points="32,70 40,64 84,64 76,70" fill="#818cf8"/>
        <polygon points="32,30 40,24 40,64 32,70" fill="#4338ca"/>
        <polygon points="76,10 84,4 84,24 76,30" fill="#3730a3"/>
        <polygon points="76,70 84,64 84,84 76,90" fill="#3730a3"/>
        <path d="M 12 10 L 76 10 L 76 30 L 32 30 L 32 70 L 76 70 L 76 90 L 12 90 Z" fill="#6366f1"/>
      </svg>
      Cadence
    </span>
    <div class="precall-title">Before we start</div>
    <div class="precall-sub">Let's make sure your mic and speakers are working.</div>

    <div class="check-card">
      <div class="check-header">
        <span class="check-label">Microphone</span>
        <span class="check-status" id="mic-status">Waiting for permission…</span>
      </div>
      <div class="mic-level" id="mic-level">
        <div class="mic-bar" id="ml1"></div><div class="mic-bar" id="ml2"></div>
        <div class="mic-bar" id="ml3"></div><div class="mic-bar" id="ml4"></div>
        <div class="mic-bar" id="ml5"></div><div class="mic-bar" id="ml6"></div>
        <div class="mic-bar" id="ml7"></div><div class="mic-bar" id="ml8"></div>
        <div class="mic-bar" id="ml9"></div><div class="mic-bar" id="ml10"></div>
        <div class="mic-bar" id="ml11"></div><div class="mic-bar" id="ml12"></div>
      </div>
    </div>

    <div class="check-card">
      <div class="check-header">
        <span class="check-label">Speakers</span>
        <span class="check-status" id="speaker-status">Not tested</span>
      </div>
      <button class="test-btn" id="test-audio-btn" onclick="playTestTone()">Play test sound</button>
    </div>

    <button class="start-btn" id="start-btn" onclick="startCall()" disabled>Start the call</button>
  </div>

  <!-- ── Screen 2: Live call ── -->
  <div class="screen" id="call-screen">
    <span class="brand">
      <svg class="brand-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <polygon points="40,24 84,24 84,64 40,64" fill="#1a1748"/>
        <polygon points="12,10 20,4 84,4 76,10" fill="#a5b4fc"/>
        <polygon points="32,70 40,64 84,64 76,70" fill="#818cf8"/>
        <polygon points="32,30 40,24 40,64 32,70" fill="#4338ca"/>
        <polygon points="76,10 84,4 84,24 76,30" fill="#3730a3"/>
        <polygon points="76,70 84,64 84,84 76,90" fill="#3730a3"/>
        <path d="M 12 10 L 76 10 L 76 30 L 32 30 L 32 70 L 76 70 L 76 90 L 12 90 Z" fill="#6366f1"/>
      </svg>
      Cadence
    </span>
    <div class="orb-scene" id="orb-scene">
      <div class="ring ring-3"></div>
      <div class="ring ring-2"></div>
      <div class="ring ring-1"></div>
      <div class="orb connecting" id="orb"></div>
    </div>
    <div class="status-label" id="status-label">Connecting…</div>
    <div class="call-mic-bars" id="call-mic-bars">
      <div class="call-mic-bar" id="cb1"></div><div class="call-mic-bar" id="cb2"></div>
      <div class="call-mic-bar" id="cb3"></div><div class="call-mic-bar" id="cb4"></div>
      <div class="call-mic-bar" id="cb5"></div>
    </div>
    <button class="end-btn" onclick="endCall()">End call</button>
  </div>

  <!-- ── Screen 3: Ended ── -->
  <div class="screen" id="ended-screen">
    <span class="brand">
      <svg class="brand-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <polygon points="40,24 84,24 84,64 40,64" fill="#1a1748"/>
        <polygon points="12,10 20,4 84,4 76,10" fill="#a5b4fc"/>
        <polygon points="32,70 40,64 84,64 76,70" fill="#818cf8"/>
        <polygon points="32,30 40,24 40,64 32,70" fill="#4338ca"/>
        <polygon points="76,10 84,4 84,24 76,30" fill="#3730a3"/>
        <polygon points="76,70 84,64 84,84 76,90" fill="#3730a3"/>
        <path d="M 12 10 L 76 10 L 76 30 L 32 30 L 32 70 L 76 70 L 76 90 L 12 90 Z" fill="#6366f1"/>
      </svg>
      Cadence
    </span>
    <div class="ended-title">That's a wrap.</div>
    <div class="ended-sub">Thank you for your time.<br>You'll hear from us soon.</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/livekit-client@2/dist/livekit-client.umd.min.js"></script>
  <script>
    const params     = new URLSearchParams(window.location.search);
    const livekitUrl = params.get('liveKitUrl');
    const token      = params.get('token');

    const micBars   = Array.from({length:12}, (_,i) => document.getElementById('ml'+(i+1)));
    const micStatus = document.getElementById('mic-status');
    const startBtn  = document.getElementById('start-btn');

    let micStream, micAnalyser, micAnimFrame;
    let micOk = false, speakerTested = false;

    async function initMic() {
      try {
        micStream = await navigator.mediaDevices.getUserMedia({audio:true, video:false});
        const ctx = new AudioContext();
        const src = ctx.createMediaStreamSource(micStream);
        micAnalyser = ctx.createAnalyser();
        micAnalyser.fftSize = 256;
        src.connect(micAnalyser);
        micStatus.textContent = 'Speak to test…';
        micStatus.className = 'check-status';
        animMic();
      } catch(e) {
        micStatus.textContent = 'Mic blocked — check browser permissions';
        micStatus.className = 'check-status bad';
      }
    }

    function animMic() {
      const buf = new Uint8Array(micAnalyser.frequencyBinCount);
      micAnalyser.getByteFrequencyData(buf);
      const level = buf.reduce((a,b)=>a+b,0) / buf.length / 255;
      const active = level > 0.02;
      micBars.forEach(b => {
        const h = active ? Math.max(4, Math.random() * level * 26 + 4) : 4;
        b.style.height = h + 'px';
        b.classList.toggle('active', active);
      });
      if (active && !micOk) {
        micOk = true;
        micStatus.textContent = 'Mic detected ✓';
        micStatus.className = 'check-status ok';
        tryEnableStart();
      }
      micAnimFrame = requestAnimationFrame(animMic);
    }

    function playTestTone() {
      const ctx = new AudioContext();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.frequency.value = 520; osc.type = 'sine';
      gain.gain.setValueAtTime(0.25, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.9);
      osc.start(); osc.stop(ctx.currentTime + 0.9);
      speakerTested = true;
      const btn = document.getElementById('test-audio-btn');
      btn.textContent = 'Sounded good? ✓';
      btn.classList.add('played');
      document.getElementById('speaker-status').textContent = 'Tested ✓';
      document.getElementById('speaker-status').className = 'check-status ok';
      tryEnableStart();
    }

    function tryEnableStart() {
      if (micOk && speakerTested) startBtn.disabled = false;
    }

    const orb         = document.getElementById('orb');
    const orbScene    = document.getElementById('orb-scene');
    const statusLabel = document.getElementById('status-label');
    const callMicBars = document.getElementById('call-mic-bars');
    const callBars    = [1,2,3,4,5].map(i => document.getElementById('cb'+i));

    let room, animFrame;
    let agentAnalyser, localAnalyser;
    let agentWasSpeaking = false, thinkTimer;

    function show(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    function setOrb(state, label) {
      orb.className      = 'orb' + (state ? ' ' + state : '');
      orbScene.className = 'orb-scene' + (state ? ' state-' + state : '');
      statusLabel.textContent = label;
    }

    function setOrbLevel(level) {
      const g = Math.min(level * 2.5, 1);
      orb.style.transform = 'scale(' + (1 + g * 0.18) + ')';
      orb.style.boxShadow = [
        '0 0 '+(40+g*72)+'px rgba(99,102,241,'+(0.20+g*0.52)+')',
        '0 0 '+(90+g*80)+'px rgba(99,102,241,'+(0.08+g*0.16)+')',
        'inset 0 0 36px rgba(0,0,0,0.55)',
        'inset 0 1px 0 rgba(255,255,255,0.07)'
      ].join(',');
    }

    function getLevel(an) {
      if (!an) return 0;
      const d = new Uint8Array(an.frequencyBinCount);
      an.getByteFrequencyData(d);
      return d.reduce((a,b)=>a+b,0)/d.length/255;
    }

    function callLoop() {
      const aLvl = getLevel(agentAnalyser);
      const lLvl = getLevel(localAnalyser);
      const aOn  = aLvl > 0.015;
      const lOn  = lLvl > 0.02;

      if (aOn) {
        clearTimeout(thinkTimer);
        if (!agentWasSpeaking) { agentWasSpeaking = true; setOrb('speaking','Speaking'); }
        setOrbLevel(aLvl);
      } else if (agentWasSpeaking) {
        agentWasSpeaking = false;
        orb.style.transform = ''; orb.style.boxShadow = '';
        setOrb('thinking','Processing…');
        thinkTimer = setTimeout(() => setOrb('','Listening…'), 2500);
      }

      if (lOn) {
        callMicBars.classList.add('active');
        callBars.forEach(b => { b.style.height = (Math.random()*lLvl*16+3)+'px'; });
      } else {
        callMicBars.classList.remove('active');
        callBars.forEach(b => { b.style.height = '3px'; });
      }

      animFrame = requestAnimationFrame(callLoop);
    }

    async function startCall() {
      if (!livekitUrl || !token) {
        alert('Invalid link — please use the URL from your email.');
        return;
      }
      cancelAnimationFrame(micAnimFrame);
      if (micStream) micStream.getTracks().forEach(t => t.stop());
      show('call-screen');

      room = new LivekitClient.Room({
        audioCaptureDefaults: { echoCancellation:true, noiseSuppression:true },
      });

      room.on(LivekitClient.RoomEvent.Connected, () => { setOrb('', 'Listening…'); callLoop(); });
      room.on(LivekitClient.RoomEvent.Disconnected, showEnded);

      room.on(LivekitClient.RoomEvent.TrackSubscribed, (track) => {
        if (track.kind !== LivekitClient.Track.Kind.Audio) return;
        const el = track.attach();
        el.style.display = 'none';
        document.body.appendChild(el);
        const ctx = new AudioContext();
        const src = ctx.createMediaElementSource(el);
        const an  = ctx.createAnalyser(); an.fftSize = 256;
        src.connect(an); an.connect(ctx.destination);
        agentAnalyser = an;
      });

      room.on(LivekitClient.RoomEvent.LocalTrackPublished, (pub) => {
        if (!pub.track || pub.track.kind !== LivekitClient.Track.Kind.Audio) return;
        const ctx = new AudioContext();
        const ms  = new MediaStream([pub.track.mediaStreamTrack]);
        const src = ctx.createMediaStreamSource(ms);
        const an  = ctx.createAnalyser(); an.fftSize = 256;
        src.connect(an);
        localAnalyser = an;
      });

      try {
        await room.connect(livekitUrl, token);
        await room.localParticipant.setMicrophoneEnabled(true);
        await room.localParticipant.setCameraEnabled(false);
      } catch(e) {
        setOrb('connecting', 'Connection failed. Please try again.');
        console.error(e);
      }
    }

    function showEnded() {
      cancelAnimationFrame(animFrame);
      show('ended-screen');
    }

    async function endCall() {
      if (room) await room.disconnect();
      else showEnded();
    }

    initMic();
  </script>
</body>
</html>
